<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Máquina de estados del enclavamiento</title><desc id="desc">Estados de arranque, marcha, mantenimiento, liberación y fallo seguro.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495e"/></marker><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:30px;font-weight:bold}.s{font-size:17px;fill:#566573}.n{font-size:17px;font-weight:bold}.b{stroke-width:2;rx:18}.l{stroke:#34495e;stroke-width:2.5;fill:none;marker-end:url(#a)}.lab{font-size:14px;fill:#34495e}</style></defs>
  <rect width="1500" height="900" fill="#f8fafc"/><text x="65" y="62" class="t">Estados del controlador</text><text x="65" y="94" class="s">Las flechas representan transiciones confirmadas por la planta, no sólo órdenes emitidas.</text>
  <rect class="b" x="75" y="190" width="160" height="75" fill="#d6eaf8" stroke="#2980b9"/><text x="155" y="235" class="n" text-anchor="middle">INICIO SEGURO</text>
  <rect class="b" x="330" y="190" width="130" height="75" fill="#d5f5e3" stroke="#239b56"/><text x="395" y="235" class="n" text-anchor="middle">LISTO</text>
  <rect class="b" x="550" y="190" width="130" height="75" fill="#d5f5e3" stroke="#239b56"/><text x="615" y="235" class="n" text-anchor="middle">MARCHA</text>
  <rect class="b" x="775" y="190" width="170" height="75" fill="#fdebd0" stroke="#d35400"/><text x="860" y="225" class="n" text-anchor="middle">PARADA</text><text x="860" y="247" class="n" text-anchor="middle">SOLICITADA</text>
  <rect class="b" x="1035" y="190" width="160" height="75" fill="#fdebd0" stroke="#d35400"/><text x="1115" y="235" class="n" text-anchor="middle">AISLAMIENTO</text>
  <rect class="b" x="1275" y="190" width="130" height="75" fill="#fdebd0" stroke="#d35400"/><text x="1340" y="235" class="n" text-anchor="middle">BLOQUEO</text>
  <path class="l" d="M235 227H330"/><text x="280" y="212" class="lab" text-anchor="middle">reset seguro</text><path class="l" d="M460 227H550"/><text x="505" y="212" class="lab" text-anchor="middle">start nuevo</text><path class="l" d="M680 227H775"/><text x="725" y="212" class="lab" text-anchor="middle">mantenimiento / stop</text><path class="l" d="M945 227H1035"/><text x="990" y="212" class="lab" text-anchor="middle">contacto abierto</text><path class="l" d="M1195 227H1275"/><text x="1235" y="212" class="lab" text-anchor="middle">abrir seccionador</text>
  <rect class="b" x="1180" y="430" width="180" height="75" fill="#fdebd0" stroke="#d35400"/><text x="1270" y="465" class="n" text-anchor="middle">VERIFICACIÓN</text><text x="1270" y="487" class="n" text-anchor="middle">CERO</text>
  <rect class="b" x="900" y="610" width="185" height="75" fill="#e8daef" stroke="#8e44ad"/><text x="992" y="655" class="n" text-anchor="middle">MANTENIMIENTO</text>
  <rect class="b" x="625" y="610" width="160" height="75" fill="#e8daef" stroke="#8e44ad"/><text x="705" y="655" class="n" text-anchor="middle">LIBERACIÓN</text>
  <rect class="b" x="335" y="610" width="190" height="75" fill="#d6eaf8" stroke="#2980b9"/><text x="430" y="645" class="n" text-anchor="middle">RESTABLECIMIENTO</text><text x="430" y="667" class="n" text-anchor="middle">puerta y seccionador</text>
  <path class="l" d="M1340 265 C1400 350 1360 430 1270 430"/><text x="1390" y="365" class="lab">dos bloqueos</text><path class="l" d="M1270 505 C1220 560 1085 632 1085 648"/><text x="1190" y="580" class="lab">energía cero</text><path class="l" d="M900 648H785"/><text x="840" y="632" class="lab" text-anchor="middle">todos fuera</text><path class="l" d="M625 648H525"/><text x="575" y="632" class="lab" text-anchor="middle">retiro personal</text><path class="l" d="M335 648 C230 570 205 390 330 265"/><text x="210" y="470" class="lab">reset seguro</text>
  <rect class="b" x="70" y="745" width="200" height="80" fill="#fadbd8" stroke="#c0392b"/><text x="170" y="790" class="n" text-anchor="middle">FALLO</text><text x="170" y="812" class="lab" text-anchor="middle">corte y acceso denegado</text>
  <path class="l" d="M615 265 C600 400 330 590 235 745"/><path class="l" d="M992 685 C850 780 330 790 270 790"/><text x="540" y="770" class="lab">emergencia, watchdog, sensor inválido o presencia con potencia</text>
</svg>

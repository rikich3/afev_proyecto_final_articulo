<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de evidencia del proyecto</title><desc id="desc">Relación entre requisitos, modelo, código, simulación, telemetría y análisis.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495e"/></marker><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:31px;font-weight:bold}.s{font-size:18px;fill:#566573}.h{font-size:20px;font-weight:bold}.p{font-size:15px;fill:#34495e}.b{stroke-width:2;rx:16}.l{stroke:#34495e;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="720" fill="#f8fafc"/><text x="65" y="65" class="t">Cadena de evidencia para la exposición</text><text x="65" y="98" class="s">Cada nivel responde una pregunta distinta; ninguno reemplaza al anterior.</text>
  <rect class="b" x="80" y="200" width="190" height="135" fill="#d6eaf8" stroke="#2980b9"/><text x="175" y="240" class="h" text-anchor="middle">Requisitos</text><text x="175" y="272" class="p" text-anchor="middle">RF-01 a RF-10</text><text x="175" y="300" class="p" text-anchor="middle">escenarios y criterios</text>
  <rect class="b" x="350" y="200" width="190" height="135" fill="#e8daef" stroke="#8e44ad"/><text x="445" y="240" class="h" text-anchor="middle">Event-B</text><text x="445" y="272" class="p" text-anchor="middle">M0 probado</text><text x="445" y="300" class="p" text-anchor="middle">M1/M2 pendientes</text>
  <rect class="b" x="620" y="200" width="190" height="135" fill="#d5f5e3" stroke="#239b56"/><text x="715" y="240" class="h" text-anchor="middle">Controlador</text><text x="715" y="272" class="p" text-anchor="middle">transición pura</text><text x="715" y="300" class="p" text-anchor="middle">pruebas unitarias</text>
  <rect class="b" x="890" y="200" width="190" height="135" fill="#fdebd0" stroke="#d35400"/><text x="985" y="240" class="h" text-anchor="middle">Planta</text><text x="985" y="272" class="p" text-anchor="middle">doble determinista</text><text x="985" y="300" class="p" text-anchor="middle">CoppeliaSim pendiente</text>
  <rect class="b" x="1160" y="200" width="190" height="135" fill="#f9e79f" stroke="#b7950b"/><text x="1255" y="240" class="h" text-anchor="middle">Monitor</text><text x="1255" y="272" class="p" text-anchor="middle">verdad física</text><text x="1255" y="300" class="p" text-anchor="middle">RF-01 independiente</text>
  <path class="l" d="M270 268H350"/><path class="l" d="M540 268H620"/><path class="l" d="M810 268H890"/><path class="l" d="M1080 268H1160"/>
  <rect class="b" x="400" y="480" width="230" height="125" fill="#d4efdf" stroke="#1e8449"/><text x="515" y="520" class="h" text-anchor="middle">Telemetría</text><text x="515" y="550" class="p" text-anchor="middle">JSONL + manifiesto</text><text x="515" y="578" class="p" text-anchor="middle">semilla y hash</text>
  <rect class="b" x="790" y="480" width="230" height="125" fill="#d4efdf" stroke="#1e8449"/><text x="905" y="520" class="h" text-anchor="middle">Análisis</text><text x="905" y="550" class="p" text-anchor="middle">corridas, episodios, p95</text><text x="905" y="578" class="p" text-anchor="middle">CSV y resumen del artículo</text>
  <path class="l" d="M1255 335 C1210 420 675 440 610 480"/><path class="l" d="M630 542H790"/>
  <text x="700" y="675" class="s" text-anchor="middle">Mensaje clave: el modelo formal, las pruebas de código y la simulación aportan evidencias complementarias.</text>

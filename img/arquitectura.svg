<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <title>Arquitectura del enclavamiento de una faja minera</title>
  <desc>Event-B especifica el controlador. El adaptador comunica con la planta y su watchdog local. Un monitor observa la verdad física y alimenta el registro independiente.</desc>
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#334155"/>
    </marker>
    <marker id="formal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#ffffff"/>
  <g font-family="Liberation Sans, sans-serif" text-anchor="middle" fill="#172b40">
    <rect x="25" y="20" width="850" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="450" y="52" font-size="26" font-weight="bold">Especificación Event-B / Rodin</text>
    <text x="450" y="82" font-size="23">M0: presencia–potencia · M1: LOTO · M2: interfaz y fallos</text>
    <rect x="25" y="155" width="490" height="160" rx="8" fill="#eaf2f7" stroke="#334155" stroke-width="2"/>
    <text x="270" y="191" font-size="26" font-weight="bold">Planta CoppeliaSim</text>
    <text x="270" y="224" font-size="22">Faja, acceso, sensores y operarios</text>
    <rect x="48" y="242" width="444" height="53" rx="5" fill="#fff5da" stroke="#9a6b12" stroke-width="2"/>
    <text x="270" y="276" font-size="23">Watchdog Lua · heartbeat / corte</text>
    <rect x="25" y="397" width="490" height="85" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="270" y="431" font-size="26" font-weight="bold">Adaptador Python / ZeroMQ</text>
    <text x="270" y="461" font-size="22">Adquisición, actuación y avance de escena</text>
    <rect x="25" y="565" width="490" height="85" rx="8" fill="#edf5ee" stroke="#334155" stroke-width="2"/>
    <text x="270" y="599" font-size="26" font-weight="bold">Controlador Python</text>
    <text x="270" y="630" font-size="22">Transición pura: estado, guardas y salidas</text>
    <rect x="595" y="155" width="280" height="105" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="735" y="191" font-size="26" font-weight="bold">Monitor físico</text>
    <text x="735" y="222" font-size="22">Posiciones y potencia</text>
    <text x="735" y="248" font-size="22">Oráculo independiente</text>
    <rect x="595" y="397" width="280" height="85" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="735" y="431" font-size="26" font-weight="bold">Registro JSONL</text>
    <text x="735" y="462" font-size="22">Decisiones y verdad física</text>
    <rect x="595" y="565" width="280" height="85" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="735" y="600" font-size="26" font-weight="bold">Análisis</text>
    <text x="735" y="630" font-size="22">CSV, métricas y figuras</text>
    <text x="160" y="350" font-size="21">Snapshot</text>
    <text x="397" y="350" font-size="21">Órdenes + heartbeat</text>
    <text x="162" y="518" font-size="21">Entradas</text>
    <text x="410" y="518" font-size="21">Salidas</text>
    <text x="735" y="331" font-size="21">Observación física</text>
    <text x="450" y="686" font-size="21">Diseño propuesto · correspondencia manual · implementación pendiente</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#flecha)">
    <path d="M160 315 V328 M160 362 V391"/>
    <path d="M395 397 V362 M395 328 V321"/>
    <path d="M160 482 V497 M160 532 V559"/>
    <path d="M395 565 V532 M395 497 V488"/>
    <path d="M515 205 H589"/>
    <path d="M735 260 V309 M735 345 V391"/>
    <path d="M515 435 H589"/>
    <path d="M515 607 H554 V466 H589"/>
    <path d="M735 482 V559"/>
  </g>
  <path d="M40 100 V135 H12 V585 H25" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#formal)"/>
  <text x="280" y="133" font-family="Liberation Sans, sans-serif" text-anchor="middle" font-size="21" fill="#475569">Correspondencia manual a revisar</text>
</svg>
